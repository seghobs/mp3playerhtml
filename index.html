<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Media Player</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">
    <div class="container-fluid my-4">
        <div class="row">
            <div class="col-lg-8">
                <div class="player-container main-player">
                    <div class="player-header text-center mb-4 d-flex justify-content-between align-items-center">
                        <button id="theme-toggle-btn" class="btn btn-sm btn-outline-light">
                            <i class="bi bi-moon-stars-fill"></i>
                        </button>
                        <h2 class="fw-bold m-0">Modern Media Player</h2>
                        <div class="dropdown">
                            <button class="btn btn-sm btn-outline-light dropdown-toggle" type="button" id="settingsDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-gear-fill"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="settingsDropdown">
                                <li><h6 class="dropdown-header">Ses Ayarları</h6></li>
                                <li><a class="dropdown-item" href="#" id="equalizer-toggle">Ekolayzer</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><h6 class="dropdown-header">Video Ayarları</h6></li>
                                <li>
                                    <div class="px-3 py-2">
                                        <label for="playback-speed" class="form-label small">Oynatma Hızı</label>
                                        <select id="playback-speed" class="form-select form-select-sm">
                                            <option value="0.5">0.5x</option>
                                            <option value="0.75">0.75x</option>
                                            <option value="1" selected>Normal</option>
                                            <option value="1.25">1.25x</option>
                                            <option value="1.5">1.5x</option>
                                            <option value="2">2x</option>
                                        </select>
                                    </div>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="#" id="view-toggle">Spektrum Görünümü <i class="bi bi-check-lg ms-2 d-none"></i></a></li>
                                <li><a class="dropdown-item" href="#" id="auto-play-toggle">Otomatik Oynatma <i class="bi bi-check-lg ms-2 d-none"></i></a></li>
                                <li><a class="dropdown-item" href="#" id="shuffle-toggle">Karıştır <i class="bi bi-check-lg ms-2 d-none"></i></a></li>
                            </ul>
                        </div>
                    </div>
                    
                    <div class="player-wrapper">
                        <div class="media-container mb-3">
                            <video id="media-player" class="w-100 rounded shadow" poster="https://placehold.co/800x450/212529/e9ecef?text=Select+Media"></video>
                            <div class="now-playing-badge" id="now-playing-badge">
                                <i class="bi bi-music-note-beamed"></i> <span id="now-playing-title">Select a file to play</span>
                            </div>
                            <div class="video-overlay" id="video-overlay">
                                <div class="video-controls-center">
                                    <button id="overlay-play-btn" class="btn btn-lg btn-primary rounded-circle">
                                        <i class="bi bi-play-fill fs-1"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Spectrum Visualization Container -->
                        <div id="spectrum-container" class="spectrum-container mb-3 d-none">
                            <canvas id="spectrum-canvas" class="w-100 rounded shadow"></canvas>
                            <div class="now-playing-badge" id="spectrum-badge">
                                <i class="bi bi-music-note-beamed"></i> <span id="spectrum-title">Select a file to play</span>
                            </div>
                        </div>
                        
                        <div class="controls-container">
                            <input type="range" class="progress-bar form-range mb-3" id="progress-bar" min="0" max="100" value="0">
                            
                            <div class="time-display d-flex justify-content-between mb-3">
                                <span id="current-time">00:00</span>
                                <span id="duration">00:00</span>
                            </div>
                            
                            <div class="player-controls d-flex justify-content-between align-items-center mb-3">
                                <div class="volume-control d-flex align-items-center">
                                    <button id="mute-btn" class="btn btn-link text-light">
                                        <i class="bi bi-volume-up-fill fs-4"></i>
                                    </button>
                                    <input type="range" class="volume-slider form-range ms-2" id="volume-slider" min="0" max="100" value="100" style="width: 100px;">
                                </div>
                                
                                <div class="playback-controls">
                                    <button id="prev-btn" class="btn btn-link text-light me-2">
                                        <i class="bi bi-skip-backward-fill fs-4"></i>
                                    </button>
                                    <button id="backward-btn" class="btn btn-link text-light me-2">
                                        <i class="bi bi-rewind-fill fs-4"></i>
                                    </button>
                                    <button id="play-btn" class="btn btn-primary rounded-circle">
                                        <i class="bi bi-play-fill fs-4"></i>
                                    </button>
                                    <button id="forward-btn" class="btn btn-link text-light ms-2">
                                        <i class="bi bi-fast-forward-fill fs-4"></i>
                                    </button>
                                    <button id="next-btn" class="btn btn-link text-light ms-2">
                                        <i class="bi bi-skip-forward-fill fs-4"></i>
                                    </button>
                                </div>
                                
                                <div class="additional-controls">
                                    <button id="shuffle-btn" class="btn btn-link text-light me-2">
                                        <i class="bi bi-shuffle fs-4"></i>
                                    </button>
                                    <button id="loop-btn" class="btn btn-link text-light me-2">
                                        <i class="bi bi-repeat fs-4"></i>
                                    </button>
                                    <button id="fullscreen-btn" class="btn btn-link text-light">
                                        <i class="bi bi-fullscreen fs-4"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="file-input-container text-center mt-4">
                            <label for="file-input" class="btn btn-outline-light me-2">
                                <i class="bi bi-file-earmark-music me-2"></i>Select Media Files
                            </label>
                            <input type="file" id="file-input" class="d-none" accept="video/mp4,audio/mp3,audio/*,video/*" multiple>
                            
                            <button id="toggle-playlist-btn" class="btn btn-outline-primary d-lg-none">
                                <i class="bi bi-music-note-list me-2"></i>Show Playlist
                            </button>
                        </div>
                        
                        <!-- Ekolayzer -->
                        <div id="equalizer-container" class="equalizer-container mt-4 d-none">
                            <div class="equalizer-header d-flex justify-content-between align-items-center mb-3">
                                <h5 class="m-0">Ekolayzer</h5>
                                <div class="equalizer-presets">
                                    <select id="equalizer-preset" class="form-select form-select-sm">
                                        <option value="flat">Düz</option>
                                        <option value="rock">Rock</option>
                                        <option value="pop">Pop</option>
                                        <option value="jazz">Jazz</option>
                                        <option value="electronic">Electronic</option>
                                        <option value="classical">Classical</option>
                                    </select>
                                </div>
                            </div>
                            <div class="equalizer-bands d-flex justify-content-between" id="equalizer-bands">
                                <!-- Ekolayzer bantları burada dinamik olarak oluşturulacak -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-4 mt-4 mt-lg-0">
                <div class="player-container playlist-container" id="playlist-container">
                    <div class="playlist-header d-flex justify-content-between align-items-center mb-3">
                        <h4 class="m-0"><i class="bi bi-music-note-list me-2"></i>Playlist</h4>
                        <div>
                            <button id="clear-playlist" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash me-1"></i>Temizle
                            </button>
                        </div>
                    </div>
                    
                    <div class="playlist-search mb-3">
                        <div class="input-group">
                            <span class="input-group-text bg-transparent text-light border-end-0">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" id="playlist-search" class="form-control bg-transparent text-light border-start-0" placeholder="Playlist içinde ara...">
                        </div>
                    </div>
                    
                    <div class="playlist-items" id="playlist-items">
                        <div class="empty-playlist text-center py-5">
                            <i class="bi bi-music-note-list fs-1 mb-3"></i>
                            <p>Your playlist is empty</p>
                            <p class="text-muted">Add media files to start playing</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tema Seçici -->
    <div class="theme-selector" id="theme-selector">
        <div class="theme-selector-header">
            <h5>Tema Seçin</h5>
            <button id="close-theme-selector" class="btn-close btn-close-white"></button>
        </div>
        <div class="theme-colors">
            <div class="theme-color" data-theme="default" style="background: linear-gradient(135deg, #6c5ce7, #00cec9);"></div>
            <div class="theme-color" data-theme="sunset" style="background: linear-gradient(135deg, #ff7675, #fdcb6e);"></div>
            <div class="theme-color" data-theme="ocean" style="background: linear-gradient(135deg, #0984e3, #81ecec);"></div>
            <div class="theme-color" data-theme="forest" style="background: linear-gradient(135deg, #00b894, #6ab04c);"></div>
            <div class="theme-color" data-theme="ruby" style="background: linear-gradient(135deg, #e84393, #fd79a8);"></div>
            <div class="theme-color" data-theme="dark" style="background: linear-gradient(135deg, #2d3436, #636e72);"></div>
        </div>
    </div>
    
    <!-- Snackbar Bildirimleri -->
    <div id="snackbar"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
